# Automotive Control Loop Configuration

# Console and logging
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# Kernel features
CONFIG_TIMING_FUNCTIONS=y

# System clock
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Thread configuration
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=512

# Disable unnecessary features for embedded
CONFIG_XIP=n
